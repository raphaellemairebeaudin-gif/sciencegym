<!doctype html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">

<link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="forge-180.png"><link rel="icon" href="forge-192.png"><title>FORGE — Modifier le profil</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<body><div class="app"><svg class="cab" viewBox="0 0 390 844" preserveAspectRatio="none" aria-hidden="true"><g fill="none" stroke-linecap="round"><path d="M386 0C386 90 378 110 381 190S388 320 382 430" stroke="#3a0c0a" stroke-width="7"/><path class="cur" d="M386 0C386 90 378 110 381 190S388 320 382 430" stroke="#ff4a3d" stroke-width="2"/><path d="M4 300C4 380 12 400 8 500S3 640 7 760" stroke="#3a0c0a" stroke-width="7"/><path class="cur" d="M4 300C4 380 12 400 8 500S3 640 7 760" stroke="#ff4a3d" stroke-width="2"/></g></svg><div class="sl"></div><div class="r"><div class="r" style="gap:12px"><a class="c pf" href="profil.html" aria-label="Retour"><svg width="22" height="22" viewBox="0 0 22 22" aria-hidden="true"><path d="M14 4l-7 7 7 7" fill="none" stroke="#ff4a3d" stroke-width="2.4"/></svg></a><div class="hud" style="line-height:1.7"><span class="rd">Sujet 001</span><br>Modifier le profil</div></div><svg width="64" height="22" viewBox="0 0 100 30" preserveAspectRatio="none" aria-hidden="true"><polyline points="0,15 20,15 26,4 33,26 40,15 60,15 66,8 72,22 78,15 100,15" fill="none" stroke="#ff4a3d" stroke-opacity=".3" stroke-width="1.5" vector-effect="non-scaling-stroke"/><polyline class="hb" pathLength="100" points="0,15 20,15 26,4 33,26 40,15 60,15 66,8 72,22 78,15 100,15" fill="none" stroke="#ff4a3d" stroke-width="2" vector-effect="non-scaling-stroke"/></svg></div><div class="t" style="font-size:30px">Modifier</div>
<div class="pg" id="fm"><div class="t gt">Identité</div><div class="fld"><label for="pseudo">Pseudo</label><input class="fi" id="pseudo" type="text" maxlength="30" autocomplete="nickname"></div><div class="two"><div class="fld"><label for="prenom">Prénom</label><input class="fi" id="prenom" type="text" maxlength="40" autocomplete="given-name"></div><div class="fld"><label for="nom">Nom</label><input class="fi" id="nom" type="text" maxlength="40" autocomplete="family-name"></div></div><div class="fld"><label for="nais">Date de naissance</label><input class="fi" id="nais" type="date" ></div><div class="t gt">Compte</div><div class="fld"><label for="email">Courriel</label><input class="fi" id="email" type="email" autocomplete="email"></div><div class="fld"><label for="mdp">Nouveau mot de passe</label><input class="fi" id="mdp" type="password" placeholder="Laisser vide pour ne pas changer" autocomplete="new-password"></div><div class="t gt">Corps</div><div class="two"><div class="fld"><label for="poids">Poids (<span class="wu">kg</span>)</label><input class="fi" id="poids" type="text" inputmode="decimal" autocomplete="off"></div><div class="fld"><label for="taille">Taille (cm)</label><input class="fi" id="taille" type="text" inputmode="decimal" autocomplete="off"></div></div><div class="fld"><label for="goal">Objectif de poids (<span class="wu">kg</span>)</label><input class="fi" id="goal" type="text" inputmode="decimal" autocomplete="off"></div></div><button class="b" id="sv" type="button">Enregistrer</button><nav class="nav"><a class="" href="accueil.html">Accueil</a><a class=" soon" href="#" data-soon>Notes</a><a class=" soon" href="#" data-soon>Budget</a><a class=" soon" href="#" data-soon>Fioles</a></nav></div><script src="forge.js?v=10"></script>
<script>
const $=i=>document.getElementById(i),num=v=>{const n=parseFloat(String(v).replace(',','.').trim());return isFinite(n)?n:null};let orig='';
(async()=>{const u=await Forge.user();if(!u)return;const db=Forge.db();
 let p=await db.from('profiles').select('pseudo,prenom,nom,naissance,poids_kg,taille_cm,objectif_kg').eq('id',u.id).maybeSingle();
 if(p.error)p=await db.from('profiles').select('pseudo').eq('id',u.id).maybeSingle();
 const d=p.data||{},f=x=>x==null?'':String(Math.round(Forge.kg2u(x)*10)/10);
 $('pseudo').value=d.pseudo||u.user_metadata?.pseudo||'';$('prenom').value=d.prenom||'';$('nom').value=d.nom||'';$('nais').value=d.naissance||'';
 $('email').value=orig=u.email||'';$('poids').value=f(d.poids_kg);$('goal').value=f(d.objectif_kg);$('taille').value=d.taille_cm==null?'':d.taille_cm;
 document.querySelectorAll('.wu').forEach(e=>e.textContent=Forge.W())})();
$('sv').onclick=async()=>{
 const pseudo=$('pseudo').value.trim(),email=$('email').value.trim(),pw=$('mdp').value,w=num($('poids').value),g=num($('goal').value),h=num($('taille').value);
 const kg=v=>v==null?null:Math.round(Forge.u2kg(v)*100)/100,bad=(v,a,b)=>v!=null&&(v<a||v>b);
 if(!pseudo)return Forge.toast('Le pseudo est requis');
 if(!/^\S+@\S+\.\S+$/.test(email))return Forge.toast('Courriel invalide');
 if(pw&&pw.length<8)return Forge.toast('Mot de passe : 8 caractères minimum');
 if(bad(kg(w),20,400)||bad(kg(g),20,400))return Forge.toast('Poids ou objectif invalide');
 if(bad(h,80,260))return Forge.toast('Taille invalide (en cm)');
 const b=$('sv');b.disabled=true;b.textContent='Enregistrement…';
 try{const u=await Forge.user();if(!u)return;const db=Forge.db();
  const row={pseudo,prenom:$('prenom').value.trim()||null,nom:$('nom').value.trim()||null,naissance:$('nais').value||null,poids_kg:kg(w),taille_cm:h,objectif_kg:kg(g)};
  let r=await db.from('profiles').update(row).eq('id',u.id).select('id');
  if(!r.error&&!r.data?.length)r=await db.from('profiles').insert({id:u.id,...row}).select('id');
  if(r.error){if(/column|schema/i.test(r.error.message))throw new Error('Colonnes manquantes : lance le SQL de migration.');throw r.error}
  const au={data:{pseudo,prenom:row.prenom,nom:row.nom}};if(email!==orig)au.email=email;if(pw)au.password=pw;
  const a=await db.auth.updateUser(au);if(a.error)throw a.error;
  Forge.toast(email!==orig?'Profil enregistré · confirme ton nouveau courriel':'Profil enregistré');setTimeout(()=>Forge.go('profil.html'),1600)
 }catch(e){Forge.toast(e.message||'Enregistrement impossible');b.disabled=false;b.textContent='Enregistrer'}};
</script></body></html>
