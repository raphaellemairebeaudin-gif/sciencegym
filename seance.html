<body><div class="app"><svg class="cab" viewBox="0 0 390 844" preserveAspectRatio="none" aria-hidden="true"><g fill="none" stroke-linecap="round"><path d="M386 0C386 90 378 110 381 190S388 320 382 430" stroke="#3a0c0a" stroke-width="7"/><path class="cur" d="M386 0C386 90 378 110 381 190S388 320 382 430" stroke="#ff4a3d" stroke-width="2"/><path d="M4 300C4 380 12 400 8 500S3 640 7 760" stroke="#3a0c0a" stroke-width="7"/><path class="cur" d="M4 300C4 380 12 400 8 500S3 640 7 760" stroke="#ff4a3d" stroke-width="2"/></g></svg><div class="sl"></div><div class="r"><div class="r" style="gap:12px"><a class="c pf" href="profil.html" aria-label="Profil"><svg width="24" height="24" viewBox="0 0 22 22" aria-hidden="true"><circle cx="11" cy="8" r="4" fill="none" stroke="#ff4a3d" stroke-width="2"/><path d="M3 20c0-5 4-7 8-7s8 2 8 7" fill="none" stroke="#ff4a3d" stroke-width="2"/></svg><i></i></a><div class="hud" style="line-height:1.7"><span class="rd">Sujet 001</span><br><span id="an">Analyse en cours · 0/6</span></div></div><svg width="64" height="22" viewBox="0 0 100 30" preserveAspectRatio="none" aria-hidden="true"><polyline points="0,15 20,15 26,4 33,26 40,15 60,15 66,8 72,22 78,15 100,15" fill="none" stroke="#ff4a3d" stroke-opacity=".3" stroke-width="1.5" vector-effect="non-scaling-stroke"/><polyline class="hb" pathLength="100" points="0,15 20,15 26,4 33,26 40,15 60,15 66,8 72,22 78,15 100,15" fill="none" stroke="#ff4a3d" stroke-width="2" vector-effect="non-scaling-stroke"/></svg></div>
<div class="r nm"><button class="ar" id="pv" type="button" aria-label="Exercice précédent">‹</button><div class="t" id="ex">—</div><button class="ar" id="nx" type="button" aria-label="Exercice suivant">›</button></div>
<div class="c g hrc" style="padding:12px 16px"><div class="r hud"><span>Rythme cardiaque</span><span>148 BPM</span></div><svg width="100%" height="44" viewBox="0 0 100 30" preserveAspectRatio="none" aria-hidden="true"><polyline points="0,15 20,15 26,4 33,26 40,15 60,15 66,8 72,22 78,15 100,15" fill="none" stroke="#ff4a3d" stroke-opacity=".3" stroke-width="1.5" vector-effect="non-scaling-stroke"/><polyline class="hb" pathLength="100" points="0,15 20,15 26,4 33,26 40,15 60,15 66,8 72,22 78,15 100,15" fill="none" stroke="#ff4a3d" stroke-width="2" vector-effect="non-scaling-stroke"/></svg></div>
<div class="c r rc"><div><div class="hud">Récupération · <span id="ix">1/6</span></div><div class="t tm" id="tm">01:00</div></div>
<div class="kg"><button type="button" data-s="30">30s</button><button type="button" data-s="60" class="on">60s</button><button type="button" data-s="90">90s</button><button type="button" data-s="120">120s</button><button type="button" id="pp" aria-label="Pause ou lecture"><svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><path d="M3 1.5l9 5.5-9 5.5z" fill="currentColor"/></svg></button><button type="button" id="rs" aria-label="Réinitialiser"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M13 8a5 5 0 1 1-1.8-3.8M13 1.5v3.7H9.3" fill="none" stroke="currentColor" stroke-width="1.8"/></svg></button></div></div>
<div class="grow ms" id="ms"></div>
<button class="b ghost" id="ae" type="button">+ Ajouter un exercice</button>
<button class="b" id="vd" type="button">Valider la mesure</button><nav class="nav"><a class="" href="accueil.html">Accueil</a><a class="on" href="seance.html">Séance</a><a class=" soon" href="#" data-soon>Notes</a><a class=" soon" href="#" data-soon>Budget</a><a class=" soon" href="#" data-soon>Fioles</a></nav></div>
<script src="forge.js"></script>
<script>
const $=i=>document.getElementById(i);

const KEY='forge_seance',P=Forge.PLAN;
let S;try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){}
if(!S||!S.ex||Date.now()-S.t0>432e5)S={nom:P.nom,t0:Date.now(),i:0,ex:P.ex.map(n=>({n,s:[{p:'',r:'',ok:false}]}))};
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}},cl=v=>String(v).replace(/[^0-9.]/g,'');
const CK='<svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M3 8.5l3.5 3.5L13 4.5" fill="none" stroke="currentColor" stroke-width="2.2"/></svg>';
function draw(){
 const e=S.ex[S.i];$('ex').textContent=e.n;$('ix').textContent=(S.i+1)+'/'+S.ex.length;
 $('ms').innerHTML=e.s.map((m,k)=>`<div class="c r mr${m.ok?' ok':''}" data-k="${k}"><span>Mesure ${k+1}</span><span class="in"><input class="pi" inputmode="decimal" autocomplete="off" placeholder="kg" value="${cl(m.p)}"${m.ok?' readonly':''}><span>×</span><input class="rp" inputmode="numeric" autocomplete="off" placeholder="rép" value="${cl(m.r)}"${m.ok?' readonly':''}><button type="button" class="cb" aria-label="Confirmer la mesure">${CK}</button></span></div>`).join('')+(e.s.length<8?'<button type="button" class="b sm ghost" id="am">+ Ajouter une mesure</button>':'');
 let a=0,b=0;S.ex.forEach(x=>x.s.forEach(m=>{b++;if(m.ok)a++}));$('an').textContent='Analyse en cours · '+a+'/'+b;save();
}
$('ms').addEventListener('input',e=>{const t=e.target,m=S.ex[S.i].s[+t.closest('.mr').dataset.k],p=t.classList.contains('pi');let v=t.value.replace(',','.').replace(/[^0-9.]/g,'');if(!p)v=v.replace('.','');t.value=v;m[p?'p':'r']=v;save()});
$('ms').addEventListener('click',e=>{
 if(e.target.closest('#am')){S.ex[S.i].s.push({p:'',r:'',ok:false});draw();return}
 const b=e.target.closest('.cb');if(!b)return;const m=S.ex[S.i].s[+b.closest('.mr').dataset.k];
 if(!m.ok&&!(+m.p>0&&+m.r>0))return Forge.toast('Remplis le poids et les répétitions');
 m.ok=!m.ok;draw();
});
$('pv').onclick=()=>{S.i=(S.i+S.ex.length-1)%S.ex.length;draw()};
$('nx').onclick=()=>{S.i=(S.i+1)%S.ex.length;draw()};
$('ae').onclick=()=>Forge.toast('Bientôt disponible'); // volontairement relié à rien pour l'instant
// Récupération
const PL=`<svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><path d="M3 1.5l9 5.5-9 5.5z" fill="currentColor"/></svg>`,PA=`<svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><path d="M3 1.5h3v11H3zM8 1.5h3v11H8z" fill="currentColor"/></svg>`;let rem=60,last=60,run=false,end=0,iv;
const mmss=s=>String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');
function tdraw(){$('tm').textContent=mmss(Math.max(0,Math.ceil(rem)));$('pp').innerHTML=run?PA:PL}
function tick(){if(!run)return;rem=(end-Date.now())/1000;if(rem<=0){rem=0;run=false;clearInterval(iv);$('tm').classList.add('done');try{navigator.vibrate&&navigator.vibrate([200,100,200])}catch(e){}}tdraw()}
function go(){end=Date.now()+rem*1000;run=true;clearInterval(iv);iv=setInterval(tick,250);$('tm').classList.remove('done')}
document.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-s]').forEach(x=>x.classList.toggle('on',x===b));last=rem=+b.dataset.s;go();tdraw()});
$('pp').onclick=()=>{if(run){rem=(end-Date.now())/1000;run=false;clearInterval(iv)}else if(rem>0)go();tdraw()};
$('rs').onclick=()=>{run=false;clearInterval(iv);rem=last;$('tm').classList.remove('done');tdraw()};
// Valider : enregistre la séance + vérifie les nouveaux PR
$('vd').onclick=async()=>{
 const sets=[];S.ex.forEach((e,i)=>e.s.forEach((m,j)=>{if(m.ok)sets.push({exercice:e.n,ordre:i+1,serie:j+1,poids_kg:+m.p,reps:Math.round(+m.r)})}));
 if(!sets.length)return Forge.toast('Confirme au moins une mesure');
 const vd=$('vd');vd.disabled=true;vd.textContent='Enregistrement…';
 try{
  if(!await Forge.user())return;const db=Forge.db();
  const [a,b]=await Promise.all([db.from('seance_series').select('poids_kg').order('poids_kg',{ascending:false}).limit(1),db.from('seance_series').select('volume').order('volume',{ascending:false}).limit(1)]);
  const pr=[];
  if(Math.max(...sets.map(x=>x.poids_kg))>(a.data?.[0]?.poids_kg||0))pr.push('charge');
  if(Math.max(...sets.map(x=>x.poids_kg*x.reps))>(b.data?.[0]?.volume||0))pr.push('poids × rép');
  const s=await db.from('seances').insert({nom:S.nom,started_at:new Date(S.t0).toISOString(),ended_at:new Date().toISOString()}).select('id').single();
  if(s.error)throw s.error;
  const r=await db.from('seance_series').insert(sets.map(x=>({...x,seance_id:s.data.id})));
  if(r.error){await db.from('seances').delete().eq('id',s.data.id);throw r.error}
  localStorage.removeItem(KEY);
  Forge.toast(pr.length?'Séance enregistrée · nouveau PR : '+pr.join(' + '):'Séance enregistrée');
  setTimeout(()=>location.href='accueil.html',1900);
 }catch(err){Forge.toast(err.message||'Enregistrement impossible');vd.disabled=false;vd.textContent='Valider la mesure'}
};
draw();tdraw();
</script></body></html>
