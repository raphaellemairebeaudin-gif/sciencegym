<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#0d0607"><meta name="color-scheme" content="dark"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><link rel="manifest" href="manifest.webmanifest"><link rel="stylesheet" href="base.css?v=13"><link rel="stylesheet" href="app.css?v=13"><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Space+Grotesk:wght@400;500;600&display=swap" rel="stylesheet"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase.js"></script><title>Fioles</title>
<style>
.fld{display:flex;flex-direction:column;gap:6px}.fld label{font-size:10px;letter-spacing:1.5px;color:#ff9a92;text-transform:uppercase}.fi{width:100%;height:42px;padding:0 11px;background:#1a0809;border:1px solid #ff4a3d77;border-radius:5px;color:#ffd9d5;font:15px 'Space Grotesk',sans-serif;outline:0}.fi:focus{border-color:#ff4a3d}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.formgrid .wide{grid-column:1/-1}.fcard{display:flex;flex-direction:column;gap:10px}.fhead{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.tag{font-size:10px;color:#ff9a92;border:1px solid #ff4a3d66;padding:4px 7px;border-radius:4px}.stock{font:24px 'Archivo Black';color:#ff4a3d}.mini{min-height:36px;padding:0 10px;border:1px solid #ff4a3d88;background:#210b0a;color:#ff9a92;border-radius:5px;font:600 12px 'Space Grotesk'}.danger{border-color:#a83a32;color:#ff8178}.history{border-top:1px solid #3a1210;padding-top:8px;font-size:12px;color:#c98f89;line-height:1.7}.hide{display:none!important}.tabs{display:flex;gap:8px}.tabs button{flex:1;height:38px;background:#170a0b;border:1px solid #ff4a3d66;color:#c98f89;border-radius:5px}.tabs button.on{background:#ff4a3d;color:#0d0607}.note{font-size:11px;color:#b98580;line-height:1.5}.pickrow{display:grid;grid-template-columns:auto 1fr 100px;align-items:center;gap:9px;padding:10px 0;border-bottom:1px solid #3a1210}.pickrow input[type=checkbox]{accent-color:#ff4a3d;width:18px;height:18px}.pickrow .fi{height:36px}.historyrow{display:flex;justify-content:space-between;gap:10px;align-items:center}.low{color:#ff8178}
</style></head><body><div class="app"><svg class="cab" viewBox="0 0 390 844" preserveAspectRatio="none" aria-hidden="true"><path d="M386 0C386 90 378 110 381 430M4 300C4 400 12 500 7 760" fill="none" stroke="#3a0c0a" stroke-width="7"/><path d="M386 0C386 90 378 110 381 430M4 300C4 400 12 500 7 760" fill="none" stroke="#ff4a3d" stroke-width="2" stroke-dasharray="4 12" class="cur"/></svg><div class="sl"></div><div class="r"><a class="c pf" href="accueil.html" aria-label="Retour">‹</a><div class="hud">Inventaire personnel</div></div><div class="t" style="font-size:30px">Fioles</div><div class="tabs"><button class="on" id="tabstock">Inventaire</button><button id="tabtake">Prises groupées</button><button id="tabhistory">Historique</button></div>
<div class="grow xl" id="stockview"><div class="c g"><div class="t" style="font-size:17px;margin-bottom:12px">Ajouter un produit</div><form id="addform" class="formgrid"><div class="fld wide"><label for="name">Nom du produit</label><input class="fi" id="name" maxlength="80" required placeholder="Nom / référence"></div><div class="fld"><label for="kind">Format</label><select class="fi" id="kind"><option value="pilule">Pilule</option><option value="gramme">Gramme</option><option value="kilo">Kilo</option><option value="gummies">Gummies</option></select></div><div class="fld"><label for="unit">Unité de suivi</label><select class="fi" id="unit"><option value="unité">Unité</option><option value="g">g</option><option value="kg">kg</option></select></div><div class="fld"><label for="qty">Quantité en stock</label><input class="fi" id="qty" type="number" min="0" step="0.001" required placeholder="Ex. 30"></div><button class="b wide" type="submit">Ajouter à l’inventaire</button></form></div><div id="items" class="xl"></div><p class="note">Journal personnel de stock et de prises. Cet outil ne détermine pas de dose ni de fréquence d’utilisation.</p></div>
<div class="grow xl hide" id="takeview"><div class="c"><div class="t" style="font-size:18px">Noter plusieurs prises</div><p class="note">Coche les produits concernés et indique la quantité à consigner pour chacun.</p><div id="takeitems"></div><button class="b" id="savebatch" type="button" style="margin-top:14px">Enregistrer les prises sélectionnées</button></div></div><div class="grow xl hide" id="historyview"></div><nav class="nav"><a href="accueil.html">Accueil</a><a href="#" data-soon>Notes</a><a href="#" data-soon>Budget</a><a class="on" href="fioles.html">Fioles</a></nav></div>
<script src="forge.js?v=13"></script><script>
const $=id=>document.getElementById(id),db=()=>Forge.db();let uid=null,products=[];const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function tabs(which){for(const k of ['stock','take','history']){$(k+'view').classList.toggle('hide',k!==which);$('tab'+k).classList.toggle('on',k===which)}if(which==='history')loadHistory();if(which==='take')drawTake()}
$('tabstock').onclick=()=>tabs('stock');$('tabtake').onclick=()=>tabs('take');$('tabhistory').onclick=()=>tabs('history');
async function load(){const r=await db().from('fioles').select('*').eq('user_id',uid).order('created_at',{ascending:false});if(r.error){$('items').innerHTML='<div class="c">'+esc(r.error.message)+'<br><small>Vérifie la migration SQL dans Supabase.</small></div>';return}products=r.data||[];draw()}
function draw(){$('items').innerHTML=products.length?products.map(x=>`<article class="c fcard" data-id="${x.id}"><div class="fhead"><div><div class="t" style="font-size:17px">${esc(x.nom)}</div><div class="m" style="margin-top:5px">${esc(x.format)} · ${esc(x.unite)}</div></div><span class="tag">EN STOCK</span></div><div class="r"><div><div class="hud">Quantité restante</div><div class="stock">${Number(x.quantite).toLocaleString('fr-CA')} <small style="font:12px 'Space Grotesk'">${esc(x.unite)}</small></div></div></div><div class="r"><button class="mini takeone" type="button">Prise rapide</button><button class="mini danger delproduct" type="button">Supprimer le produit</button></div></article>`).join(''):'<div class="c">Aucun produit. Ajoute ton premier élément ci-dessus.</div>'}
$('addform').onsubmit=async e=>{e.preventDefault();const b=e.submitter;b.disabled=true;try{const row={user_id:uid,nom:$('name').value.trim(),format:$('kind').value,unite:$('unit').value,quantite:Number($('qty').value)};if(!row.nom||!Number.isFinite(row.quantite)||row.quantite<0)throw Error('Vérifie le nom et les quantités.');const r=await db().from('fioles').insert(row);if(r.error)throw r.error;$('addform').reset();await load();Forge.toast('Produit ajouté')}catch(err){Forge.toast(err.message||'Ajout impossible')}finally{b.disabled=false}};
async function batchTake(entries){const r=await db().rpc('enregistrer_prises_fioles',{p_prises:entries.map(x=>({fiole_id:x.id,quantite:x.quantite}))});if(r.error)throw r.error;await load();Forge.toast(entries.length+' prise(s) enregistrée(s)')}
$('items').onclick=async e=>{const c=e.target.closest('[data-id]');if(!c)return;const p=products.find(x=>x.id===c.dataset.id);try{if(e.target.closest('.delproduct')){if(!confirm('Supprimer « '+p.nom+' » et tout son historique ? Cette action est irréversible.'))return;const r=await db().from('fioles').delete().eq('id',p.id).eq('user_id',uid);if(r.error)throw r.error;await load();Forge.toast('Produit supprimé')}else if(e.target.closest('.takeone')){const v=prompt('Quantité à inscrire comme prise ('+p.unite+') :');if(v===null)return;const n=Number(v);if(!Number.isFinite(n)||n<=0)throw Error('Quantité invalide');await batchTake([{id:p.id,quantite:n}])}}catch(err){Forge.toast(err.message||'Opération impossible')}};
function drawTake(){$('takeitems').innerHTML=products.length?products.map(p=>`<label class="pickrow"><input type="checkbox" class="pick" data-id="${p.id}"><span><b>${esc(p.nom)}</b><br><small>${Number(p.quantite)} ${esc(p.unite)} disponibles</small></span><input class="fi takeqty" data-id="${p.id}" type="number" min="0.001" step="0.001" placeholder="Quantité" disabled></label>`).join(''):'<p class="note">Ajoute d’abord un produit à l’inventaire.</p>';document.querySelectorAll('.pick').forEach(ch=>ch.onchange=()=>{const q=document.querySelector('.takeqty[data-id="'+ch.dataset.id+'"]');q.disabled=!ch.checked;if(ch.checked)q.focus()})}
$('savebatch').onclick=async()=>{const entries=[];for(const ch of document.querySelectorAll('.pick:checked')){const p=products.find(x=>x.id===ch.dataset.id),q=Number(document.querySelector('.takeqty[data-id="'+ch.dataset.id+'"]').value);if(!q||q<=0||q>Number(p.quantite))return Forge.toast('Quantité invalide ou stock insuffisant pour '+p.nom);entries.push({id:p.id,quantite:q})}if(!entries.length)return Forge.toast('Sélectionne au moins un produit');const b=$('savebatch');b.disabled=true;try{await batchTake(entries);drawTake()}catch(err){Forge.toast(err.message||'Impossible d’enregistrer les prises')}finally{b.disabled=false}};
async function loadHistory(){const r=await db().from('prises_fioles').select('id,quantite,unite,pris_le,fiole_id,fioles(nom)').eq('user_id',uid).order('pris_le',{ascending:false}).limit(200);if(r.error){$('historyview').innerHTML='<div class="c">'+esc(r.error.message)+'</div>';return}const a=r.data||[];$('historyview').innerHTML=a.length?a.map(x=>`<div class="c historyrow"><div><div class="t" style="font-size:15px">${esc(x.fioles?.nom||'Produit')}</div><div class="m" style="margin-top:6px">${Number(x.quantite)} ${esc(x.unite)} · ${new Date(x.pris_le).toLocaleString('fr-CA')}</div></div><button class="mini danger deltake" data-id="${x.id}" type="button">Supprimer</button></div>`).join(''):'<div class="c">Aucune prise enregistrée.</div>';document.querySelectorAll('.deltake').forEach(b=>b.onclick=async()=>{if(!confirm('Supprimer cette prise et remettre sa quantité dans le stock ?'))return;b.disabled=true;try{const z=await db().rpc('supprimer_prise_fiole',{p_prise_id:b.dataset.id});if(z.error)throw z.error;await loadHistory();await load();Forge.toast('Prise supprimée et stock restauré')}catch(err){Forge.toast(err.message||'Suppression impossible')}finally{b.disabled=false}})}
(async()=>{const u=await Forge.user();if(!u)return;uid=u.id;await load()})();
</script></body></html>
