<script src="forge.js?v=11"></script>
<script>
const $=i=>document.getElementById(i);
function paint(){const u=Forge.U.get();$('ul').textContent='Unités ('+(u.w==='lb'?'lbs':'kg')+', '+u.c+')';
 document.querySelectorAll('.sg').forEach(g=>g.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.v===u[g.dataset.k])));
 document.querySelectorAll('.wu').forEach(e=>e.textContent=Forge.W());vals()}
document.querySelectorAll('.ah').forEach(b=>b.onclick=()=>b.parentElement.classList.toggle('on'));
document.querySelectorAll('.sg button').forEach(b=>b.onclick=async()=>{
 const u=Forge.U.get();u[b.parentElement.dataset.k]=b.dataset.v;Forge.U.set(u);paint();
 const x=await Forge.user();if(x)Forge.db().from('profiles').update({unite_poids:u.w,unite_monnaie:u.c}).eq('id',x.id).then(()=>{},()=>{})});
$('mp').onclick=()=>Forge.go('modifier-profil.html');
$('lo').onclick=async()=>{const {error}=await Forge.db().auth.signOut();if(error)return Forge.toast(error.message);Forge.go('index.html')};
paint();
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function vals(){const d=window._d||{},k=x=>x==null?'—':Forge.fmt(Forge.kg2u(x));$('pw').textContent=k(d.poids_kg);$('pgl').textContent=k(d.objectif_kg);$('ph').textContent=d.taille_cm==null?'—':Forge.fmt(d.taille_cm)}
(async()=>{const u=await Forge.user();if(!u)return;const db=Forge.db();
 let p=await db.from('profiles').select('pseudo,prenom,nom,poids_kg,taille_cm,objectif_kg,unite_poids,unite_monnaie').eq('id',u.id).maybeSingle();
 if(p.error)p=await db.from('profiles').select('pseudo,unite_poids,unite_monnaie').eq('id',u.id).maybeSingle();
 const d=p.data||{};window._d=d;
 $('ps').textContent=d.pseudo||u.user_metadata?.pseudo||'membre';
 const fn=[d.prenom,d.nom].filter(Boolean).join(' ');$('em').innerHTML=(fn?esc(fn)+'<br>':'')+esc(u.email||'');
 if(d.unite_poids)Forge.U.set({w:d.unite_poids,c:d.unite_monnaie||'$'});
 paint()})();

</script></body></html>
