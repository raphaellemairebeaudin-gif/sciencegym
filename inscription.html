<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#080303"><title>FORGE — Créer un compte</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Space+Grotesk:wght@400;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:#080303;color:#f3cfcb;font-family:'Space Grotesk',system-ui,sans-serif}
body{background:radial-gradient(ellipse at 50% 35%,#1c0707,#080303 72%);min-height:100vh}
main{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:76px 18px 32px}
.container{width:100%;max-width:480px;padding:30px 26px;background:rgba(16,6,6,.78);border:1px solid #63201c;border-radius:14px;box-shadow:0 0 35px rgba(255,59,48,.12)}
.t{font-family:'Archivo Black','Arial Black',Impact,sans-serif}
h1{font-size:clamp(38px,10vw,52px);color:#ff3b30;text-align:center;margin:0 0 8px;text-shadow:0 0 16px rgba(255,59,48,.35)}
.subtitle{text-align:center;color:#b9645e;letter-spacing:3px;margin:0 0 30px;font-size:13px}
.form-group{margin:18px 0;text-align:left}
label{display:block;font-size:13px;color:#ffb0aa;margin-bottom:8px;letter-spacing:1.5px;text-transform:uppercase}
input{width:100%;padding:14px 15px;background:#1c0808;border:1px solid #8b3029;border-radius:7px;color:#f3cfcb;font:16px 'Space Grotesk',sans-serif}
input:focus{outline:none;border-color:#ff786e;box-shadow:0 0 0 3px rgba(255,59,48,.12)}
input::placeholder{color:#8b5855}
.submit-btn{width:100%;padding:15px;margin:18px 0 8px;background:#1c0808;border:2px solid #ff3b30;border-radius:7px;color:#ff3b30;font:16px 'Archivo Black',sans-serif;letter-spacing:2px;cursor:pointer}
.submit-btn:disabled{opacity:.55;cursor:wait}
.form-info{text-align:center;color:#d9aaa6;font-size:14px;line-height:1.7;margin:20px 0 0}
a{color:#ff6259;text-decoration:none;border-bottom:1px solid #ff6259}
.back-btn{position:fixed;top:20px;left:20px;color:#d9aaa6;background:transparent;border:1px solid #8b3029;padding:9px 14px;border-radius:6px;cursor:pointer;font:14px 'Space Grotesk',sans-serif}
.message{display:none;margin:14px 0 0;padding:12px;border-radius:6px;font-size:14px;line-height:1.5;background:#210c0b;border:1px solid #8b3029;color:#ffd0cb}
.message.show{display:block}
.scan{position:fixed;inset:0;pointer-events:none;opacity:.18;background:repeating-linear-gradient(0deg,rgba(0,0,0,.25) 0 1px,transparent 1px 3px)}
@media(max-width:420px){.container{padding:26px 20px}.back-btn{top:12px;left:12px}}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>
</head>
<body>
<button class="back-btn" type="button" onclick="location.href='index.html'">← Retour</button>
<main><section class="container">
<h1 class="t">FORGE</h1><p class="subtitle">REJOINDRE LE GYM</p>

<form id="signupForm">
  <div class="form-group"><label for="pseudo">Pseudo</label><input id="pseudo" name="pseudo" type="text" placeholder="Ton nom dans le gym" maxlength="30" autocomplete="nickname" required></div>
  <div class="form-group"><label for="email">Adresse courriel</label><input id="email" name="email" type="email" placeholder="nom@exemple.com" autocomplete="email" required></div>
  <div class="form-group"><label for="password">Mot de passe</label><input id="password" name="password" type="password" placeholder="8 caractères minimum" minlength="8" autocomplete="new-password" required></div>
  <div class="form-group"><label for="confirmPassword">Confirmer le mot de passe</label><input id="confirmPassword" name="confirmPassword" type="password" placeholder="Répète ton mot de passe" minlength="8" autocomplete="new-password" required></div>
  <button class="submit-btn" id="submitBtn" type="submit">CRÉER MON COMPTE</button>
</form>
<p class="form-info">Tu as déjà un compte ? <a href="login.html">Se connecter</a></p>

<div id="message" class="message" role="status" aria-live="polite"></div>
</section></main><div class="scan"></div>
<script>
const form=document.getElementById('signupForm');
const msg=document.getElementById('message');
const btn=document.getElementById('submitBtn');
function showMessage(text,ok=false){msg.textContent=text;msg.className='message show';msg.style.borderColor=ok?'#5b8b57':'#8b3029';}
form.addEventListener('submit',async(e)=>{
  e.preventDefault(); msg.className='message';
  const pseudo=document.getElementById('pseudo').value.trim();
  const email=document.getElementById('email').value.trim();
  const password=document.getElementById('password').value;
  const confirmation=document.getElementById('confirmPassword').value;
  if(password!==confirmation){showMessage('Les deux mots de passe ne correspondent pas.');return;}
  if(password.length<8){showMessage('Le mot de passe doit contenir au moins 8 caractères.');return;}
  btn.disabled=true;btn.textContent='CRÉATION EN COURS…';
  try{
    const {data,error}=await window.forgeSupabase.auth.signUp({
      email,password,
      options:{
        data:{pseudo},
        emailRedirectTo:new URL('accueil.html',window.location.href).href
      }
    });
    if(error) throw error;
    if(data.session){
      window.location.href='accueil.html';
    }else{
      showMessage('Ton compte a été créé. Vérifie ta boîte courriel et clique sur le lien de confirmation pour activer ton compte. Tu seras ensuite redirigé vers l’accueil.',true);
      form.reset();
    }
  }catch(err){showMessage(err.message||'Impossible de créer le compte. Réessaie.');}
  finally{btn.disabled=false;btn.textContent='CRÉER MON COMPTE';}
});
</script>
</body></html>
