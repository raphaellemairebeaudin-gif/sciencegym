<script>
const $=i=>document.getElementById(i);

$('go').onclick=()=>Forge.go('seance.html');$('hs').onclick=()=>Forge.go('historique.html');
(async()=>{
 const u=await Forge.user();if(!u)return;const db=Forge.db(),F=Forge;
 const mon=new Date();mon.setHours(0,0,0,0);mon.setDate(mon.getDate()-((mon.getDay()+6)%7));
 const [pr,ch,vo,tot,wk,rp,ls]=await Promise.all([
  db.from('profiles').select('pseudo').eq('id',u.id).maybeSingle(),
  db.from('seance_series').select('poids_kg').order('poids_kg',{ascending:false}).limit(1),
  db.from('seance_series').select('poids_kg,reps').order('volume',{ascending:false}).limit(1),
  db.from('seances').select('id',{count:'exact',head:true}),
  db.from('seances').select('id',{count:'exact',head:true}).gte('ended_at',mon.toISOString()),
  db.from('rapports').select('numero,texte').eq('vedette',true).limit(1),
  db.from('seances').select('nom,muscles,nb_exercices').order('ended_at',{ascending:false}).limit(1)]);
 let l=ls.data?.[0];
 if(ls.error){const r=await db.from('seances').select('nom').order('ended_at',{ascending:false}).limit(1);l=r.data?.[0]}
 $('hi').textContent='Salut, '+(pr.data?.pseudo||u.user_metadata?.pseudo||'membre');
 $('ps').textContent='Protocole · séance '+String(tot.count||0).padStart(3,'0');
 $('pn').textContent=l?.nom||'Aucune séance';$('pm').textContent=l?.muscles||'—';
 const n=l?.nb_exercices;$('pe').textContent=n==null?'—':n+' exercice'+(n>1?'s':'');
 $('v3').textContent=wk.count||0;
 const fc=await db.from('fioles').select('id',{count:'exact',head:true});if(!fc.error)$('fcount').textContent=(fc.count||0)+' produit'+((fc.count||0)>1?'s':'');
 const a=vo.data?.[0],b=ch.data?.[0];
 if(a)$('v1').textContent=F.fmt(F.kg2u(a.poids_kg))+'×'+a.reps;
 if(b)$('v2').textContent=F.fmt(F.kg2u(b.poids_kg))+' '+F.W();
 $('rs').textContent='— '+F.U.get().c;
 const r=rp.data?.[0];if(r){$('rh').textContent='Rapport #'+String(r.numero).padStart(3,'0');$('rt').textContent=r.texte}
})();
</script></body></html>
