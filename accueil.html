<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#080303"><title>FORGE — Accueil</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Space+Grotesk:wght@400;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% 30%,#1c0707,#080303 75%);color:#f3cfcb;font-family:'Space Grotesk',sans-serif}
main{max-width:850px;margin:auto;padding:28px 22px}.top{display:flex;justify-content:space-between;align-items:center;gap:16px;border-bottom:1px solid #63201c;padding-bottom:18px}
h1{font:clamp(34px,8vw,54px) 'Archivo Black',sans-serif;color:#ff3b30;margin:0;text-shadow:0 0 15px #5b1714}
button{background:#1c0808;border:1px solid #ff3b30;color:#ff6259;border-radius:6px;padding:10px 15px;font:14px 'Space Grotesk',sans-serif;cursor:pointer}
.panel{margin-top:36px;padding:28px;border:1px solid #63201c;border-radius:12px;background:rgba(16,6,6,.75);box-shadow:0 0 30px rgba(255,59,48,.08)}
h2{font:24px 'Archivo Black',sans-serif;color:#ff6259;margin-top:0}.muted{color:#b9645e}.email{overflow-wrap:anywhere}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase.js"></script>
</head><body><main>
<header class="top"><h1>FORGE</h1><button id="logout">DÉCONNEXION</button></header>
<section class="panel"><p class="muted">ESPACE MEMBRE</p><h2>Bienvenue <span id="pseudo">…</span></h2>
<p>Ton compte est connecté. Cette page est un accueil temporaire en attendant la suite de ton application.</p>
<p class="muted">Adresse courriel : <span class="email" id="email">…</span></p></section>
</main>
<script>
(async()=>{
 const {data:{session},error}=await window.forgeSupabase.auth.getSession();
 if(error||!session){location.replace('login.html');return;}
 const user=session.user;
 const {data:profile}=await window.forgeSupabase.from('profiles').select('pseudo').eq('id',user.id).maybeSingle();
 document.getElementById('pseudo').textContent=profile?.pseudo||user.user_metadata?.pseudo||'membre';
 document.getElementById('email').textContent=user.email||'';
})();
document.getElementById('logout').addEventListener('click',async()=>{
 const {error}=await window.forgeSupabase.auth.signOut();
 if(error){alert(error.message);return;}location.replace('index.html');
});
</script></body></html>
